name: Deploy do IQHost FTP
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Utworzenie pliku .env dla serwera produkcyjnego
        run: |
          echo "NODE_ENV=production" >> .env
          echo "NEXT_PUBLIC_KEYSTATIC_GITHUB_CLIENT_ID=${{ secrets.NEXT_PUBLIC_KEYSTATIC_GITHUB_CLIENT_ID }}" >> .env
          echo "KEYSTATIC_GITHUB_CLIENT_SECRET=${{ secrets.KEYSTATIC_GITHUB_CLIENT_SECRET }}" >> .env
          echo "KEYSTATIC_GITHUB_CLIENT_ID=${{ secrets.KEYSTATIC_GITHUB_CLIENT_ID }}" >> .env
          echo "KEYSTATIC_SECRET=${{ secrets.KEYSTATIC_SECRET }}" >> .env

      - name: Instalacja pakietów
        run: npm install

      - name: Budowanie Next.js (Build)
        env:
          NEXT_PUBLIC_KEYSTATIC_GITHUB_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_KEYSTATIC_GITHUB_CLIENT_ID }}
        run: npm run build

      - name: Utworzenie znacznika restartu LiteSpeed (tmp/restart.txt)
        run: |
          mkdir -p tmp
          date +%s > tmp/restart.txt
          echo "Utworzono znacznik restartu z timestampem: $(cat tmp/restart.txt)"

      - name: Reset pamięci synchronizacji FTP (zapobieganie błędowi 550)
        run: |
          echo "Usuwanie ewentualnego zawieszonego pliku stanu .ftp-deploy-sync-state.json..."
          SERVER="${{ secrets.FTP_SERVER }}"
          SERVER="${SERVER#ftp://}"
          SERVER="${SERVER#ftps://}"
          curl -s --ftp-pasv -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${SERVER}/test/" \
            -Q "-DELE .ftp-deploy-sync-state.json" || true

      - name: Wysyłanie plików przez FTP do IQHost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: test/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.htaccess

      - name: Wzbudzenie serwera (Automatyczny Restart LiteSpeed)
        run: |
          echo "Wysyłam żądanie HTTP, aby LiteSpeed wykrył restart.txt i uruchomił nowy kod..."
          sleep 3
          curl -s -i "https://zenart3d.atoma.pl/test" | head -n 15 || true
          echo "✅ Wdrożenie i automatyczny restart zakończone sukcesem!"
