name: Deploy do IQHost FTP
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Utworzenie pliku .env dla serwera produkcyjnego
        env:
          KEYSTATIC_CLIENT_ID: ${{ secrets.KEYSTATIC_GITHUB_CLIENT_ID }}
          KEYSTATIC_CLIENT_SECRET: ${{ secrets.KEYSTATIC_GITHUB_CLIENT_SECRET }}
          NEXT_PUBLIC_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_KEYSTATIC_GITHUB_CLIENT_ID }}
          KEYSTATIC_SEC: ${{ secrets.KEYSTATIC_SECRET }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASSWORD || secrets.ADMIN_PASS || secrets.UPLOAD_SECRET || secrets.PASSWORD }}
        run: |
          node -e "
            const fs = require('fs');
            const pass = process.env.ADMIN_PASS || 'zenart3d';
            const lines = [
              'NODE_ENV=production',
              'NEXT_PUBLIC_KEYSTATIC_GITHUB_CLIENT_ID=' + (process.env.NEXT_PUBLIC_CLIENT_ID || ''),
              'KEYSTATIC_GITHUB_CLIENT_ID=' + (process.env.KEYSTATIC_CLIENT_ID || ''),
              'KEYSTATIC_GITHUB_CLIENT_SECRET=' + (process.env.KEYSTATIC_CLIENT_SECRET || ''),
              'KEYSTATIC_SECRET=' + (process.env.KEYSTATIC_SEC || ''),
              'ADMIN_PASSWORD=' + pass,
              'UPLOAD_SECRET=' + pass
            ];
            fs.writeFileSync('.env', lines.join('\n') + '\n');
            console.log('✓ Plik .env został wygenerowany pomyślnie.');
          "
          echo "!.env" > .git-ftp-include
          echo "!tmp/restart.txt" >> .git-ftp-include

      - name: Instalacja pakietów
        run: npm install

      - name: Budowanie Next.js (Build)
        env:
          NEXT_PUBLIC_KEYSTATIC_GITHUB_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_KEYSTATIC_GITHUB_CLIENT_ID }}
        run: npm run build

      - name: Utworzenie znacznika restartu LiteSpeed (tmp/restart.txt)
        run: |
          mkdir -p tmp
          date +%s > tmp/restart.txt
          echo "Utworzono znacznik restartu z timestampem: $(cat tmp/restart.txt)"

      - name: Reset pamięci synchronizacji FTP (zapobieganie błędowi 550)
        run: |
          echo "Usuwanie ewentualnego zawieszonego pliku stanu .ftp-deploy-sync-state.json..."
          SERVER="${{ secrets.FTP_SERVER }}"
          SERVER="${SERVER#ftp://}"
          SERVER="${SERVER#ftps://}"
          curl -s --ftp-pasv -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${SERVER}/test/" \
            -Q "-DELE .ftp-deploy-sync-state.json" || true

      - name: Wysyłanie plików przez FTP do IQHost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: test/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.htaccess

      - name: Przesłanie pliku .env oraz restart.txt na FTP
        run: |
          echo "Wysyłanie .env i tmp/restart.txt na serwer FTP przez curl..."
          SERVER="${{ secrets.FTP_SERVER }}"
          SERVER="${SERVER#ftp://}"
          SERVER="${SERVER#ftps://}"
          USER="${{ secrets.FTP_USERNAME }}"
          PASS="${{ secrets.FTP_PASSWORD }}"

          # Bezpośredni upload .env na FTP z flagą --ftp-create-dirs
          curl -s --ftp-pasv --ftp-create-dirs -T .env -u "$USER:$PASS" "ftp://${SERVER}/test/.env"
          echo "✓ Plik .env przesłany na serwer FTP."

          # Bezpośredni upload tmp/restart.txt na FTP
          curl -s --ftp-pasv --ftp-create-dirs -T tmp/restart.txt -u "$USER:$PASS" "ftp://${SERVER}/test/tmp/restart.txt"
          echo "✓ Plik tmp/restart.txt przesłany na serwer FTP."

      - name: Synchronizacja usuniętych projektów i kategorii z serwera FTP
        run: |
          echo "Sprawdzanie osieroconych projektów i kategorii na FTP..."
          SERVER="${{ secrets.FTP_SERVER }}"
          SERVER="${SERVER#ftp://}"
          SERVER="${SERVER#ftps://}"
          USER="${{ secrets.FTP_USERNAME }}"
          PASS="${{ secrets.FTP_PASSWORD }}"

          # Usuwanie projektów usuniętych z repozytorium
          REMOTE_PROJECTS=$(curl -s -l --ftp-pasv -u "$USER:$PASS" "ftp://${SERVER}/test/src/content/projects/" || true)
          for raw_file in $REMOTE_PROJECTS; do
            file=$(basename "$raw_file" | tr -d '\r')
            if [ -n "$file" ] && [ "$file" != "." ] && [ "$file" != ".." ] && [[ "$file" == *.json ]]; then
              if [ ! -f "src/content/projects/$file" ]; then
                echo "Wykryto usunięty projekt na serwerze: $file - usuwam z FTP..."
                curl -s --ftp-pasv -u "$USER:$PASS" "ftp://${SERVER}/" -Q "-DELE test/src/content/projects/$file" || true
              fi
            fi
          done

          # Usuwanie kategorii usuniętych z repozytorium
          REMOTE_CATS=$(curl -s -l --ftp-pasv -u "$USER:$PASS" "ftp://${SERVER}/test/src/content/categories/" || true)
          for raw_file in $REMOTE_CATS; do
            file=$(basename "$raw_file" | tr -d '\r')
            if [ -n "$file" ] && [ "$file" != "." ] && [ "$file" != ".." ] && [[ "$file" == *.json ]]; then
              if [ ! -f "src/content/categories/$file" ]; then
                echo "Wykryto usuniętą kategorię na serwerze: $file - usuwam z FTP..."
                curl -s --ftp-pasv -u "$USER:$PASS" "ftp://${SERVER}/" -Q "-DELE test/src/content/categories/$file" || true
              fi
            fi
          done

      - name: Wzbudzenie serwera (Automatyczny Restart LiteSpeed)
        run: |
          echo "Wysyłam żądanie HTTP, aby LiteSpeed wykrył restart.txt i uruchomił nowy kod..."
          sleep 3
          curl -s -i "https://zenart3d.atoma.pl/test" | head -n 15 || true
          echo "✅ Wdrożenie i automatyczny restart zakończone sukcesem!"
